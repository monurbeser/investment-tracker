name: Deploy to GitHub Pages

# Static build of the dashboard. Binance data is fetched live by the browser;
# Yahoo Finance data (no CORS) is snapshotted here and republished every 15 min,
# including the US signal scan (/signals).
on:
  push:
    branches: [main, "claude/vibrant-darwin-drlrum"]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Start Yahoo forwarder (browser TLS fingerprint)
        run: |
          pip install --quiet curl_cffi
          nohup python scripts/yahoo_proxy.py 8765 > yahoo_proxy.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8765/ && break; sleep 1; done
      - name: Snapshot Yahoo Finance data
        run: npx tsx scripts/snapshot.ts public
        env:
          YAHOO_BASE: http://127.0.0.1:8765
          # company profiles are reused from the live site for 24h (US signals page)
          PREVIOUS_SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - name: Yahoo forwarder log
        if: always()
        run: tail -n 40 yahoo_proxy.log || true
      - name: Build static site
        run: ./scripts/build-static.sh
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
