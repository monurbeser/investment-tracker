name: Deploy to GitHub Pages

# Static build of the dashboard. Binance data is fetched live by the browser;
# Yahoo Finance data (no CORS) is snapshotted here and republished every 15 min.
on:
  push:
    branches: [main, "claude/vibrant-darwin-drlrum"]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Try to enable GitHub Pages (Source = GitHub Actions)
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start Yahoo forwarder (browser TLS fingerprint)
        run: |
          pip install --quiet curl_cffi
          nohup python scripts/yahoo_proxy.py 8765 > yahoo_proxy.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8765/ && break; sleep 1; done
      - name: Snapshot Yahoo Finance data
        run: npx tsx scripts/snapshot.ts public
        env:
          YAHOO_BASE: http://127.0.0.1:8765
      - name: "Diagnostics: Yahoo symbols for ADX companies"
        if: always()
        run: |
          for q in "Aldar Properties" "First Abu Dhabi Bank" "Abu Dhabi Commercial Bank" "International Holding Company" "Emirates Telecommunications" "ADNOC Gas" "ADNOC Drilling" "Abu Dhabi National Energy"; do
            echo "== $q"
            curl -s "http://127.0.0.1:8765/v1/finance/search?q=$(python -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")&quotesCount=6&newsCount=0" \
              | python -c "import json,sys;[print(' ',x.get('symbol'),x.get('exchange'),x.get('exchDisp'),x.get('shortname')) for x in json.load(sys.stdin).get('quotes',[])]" || true
          done
      - name: Yahoo forwarder log
        if: always()
        run: tail -n 40 yahoo_proxy.log || true
      - name: Build static site
        run: ./scripts/build-static.sh
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
