name: Deploy to GitHub Pages

# Static build of the dashboard. Binance data is fetched live by the browser;
# Yahoo Finance data (no CORS) is snapshotted here and republished every 15 min.
on:
  push:
    branches: [main, "claude/vibrant-darwin-drlrum"]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Try to enable GitHub Pages (Source = GitHub Actions)
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - name: Snapshot Yahoo Finance data
        run: npx tsx scripts/snapshot.ts public
      - name: Build static site
        run: ./scripts/build-static.sh
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
